<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Text Picker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="header__icon" src="icons/icon48.png" width="28" height="28" alt="" />
      <div class="header__text">
        <div class="header__title">DeepSeek Text Picker</div>
        <div class="header__sub" id="version">—</div>
      </div>
    </header>

    <nav class="menu" aria-label="扩展菜单">
      <div class="menu__tip">
        <p class="menu__tip-lead">在 DeepSeek 的回答底部：</p>
        <ol class="menu__tip-list">
          <li>
            点击
            <span class="menu__tip-icon" title="导出会话" aria-label="导出会话">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M8 1.25a.75.75 0 0 1 .75.75v6.19l1.72-1.72a.75.75 0 1 1 1.06 1.06l-3 3a.75.75 0 0 1-1.06 0l-3-3a.75.75 0 0 1 1.06-1.06l1.72 1.72V2A.75.75 0 0 1 8 1.25ZM2.75 10a.75.75 0 0 1 .75.75v1.5c0 .69.56 1.25 1.25 1.25h6.5c.69 0 1.25-.56 1.25-1.25v-1.5a.75.75 0 0 1 1.5 0v1.5A2.75 2.75 0 0 1 11.25 14h-6.5A2.75 2.75 0 0 1 2 12.25v-1.5a.75.75 0 0 1 .75-.75Z"
                />
              </svg>
            </span>
            可以导出会话为 Markdown。
          </li>
          <li>
            点击
            <span class="menu__tip-icon" title="显示原文" aria-label="显示原文">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M3.5 1.5A1.5 1.5 0 0 1 5 0h4.293L13 3.707V14.5A1.5 1.5 0 0 1 11.5 16h-6A1.5 1.5 0 0 1 4 14.5v-13Zm5 .5V4h2.5L8.5 2ZM5.25 7a.75.75 0 0 0 0 1.5h5.5a.75.75 0 0 0 0-1.5h-5.5Zm0 3a.75.75 0 0 0 0 1.5h5.5a.75.75 0 0 0 0-1.5h-5.5Z"
                />
              </svg>
            </span>
            可以查看 Markdown 原文。
          </li>
        </ol>
      </div>

      <div class="menu__divider" role="separator"></div>

      <button type="button" class="menu__item" data-url="https://chat.deepseek.com/">
        <span class="menu__label">打开 DeepSeek</span>
        <span class="menu__ext" title="在新标签页打开" aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="menu__item"
        data-url="https://github.com/zhengqingquan/deepseek-text-picker"
      >
        <span class="menu__label">GitHub 仓库</span>
        <span class="menu__ext" title="在新标签页打开" aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="menu__item"
        data-url="https://github.com/zhengqingquan/deepseek-text-picker/releases"
      >
        <span class="menu__label">查看更新</span>
        <span class="menu__ext" title="在新标签页打开" aria-hidden="true"></span>
      </button>

      <div class="menu__divider" role="separator"></div>

      <button
        type="button"
        class="menu__item menu__item--accent"
        data-url="https://zhengqingquan.github.io/donate-page/"
      >
        <span class="menu__label">打赏支持</span>
        <span class="menu__ext" title="在新标签页打开" aria-hidden="true"></span>
      </button>
    </nav>
    <script src="popup.js"></script>
  </body>
</html>
